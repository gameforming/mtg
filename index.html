<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MTG Game</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<header>

    <h1>MTG Game</h1>

    <nav>

        <button onclick="showPage('searchPage')">
            Search
        </button>

        <button onclick="showPage('collectionPage')">
            Collection
        </button>

        <button onclick="showPage('decksPage')">
            Decks
        </button>
        <button onclick="openPlay()">
            Play
        </button>
    </nav>

</header>


<main>

    <!-- ========================= -->
    <!-- SEARCH -->
    <!-- ========================= -->

    <section id="searchPage">

        <h2>Search Cards</h2>

        <div class="searchBox">

            <input
                id="searchInput"
                type="text"
                placeholder="Search cards..."
                onkeydown="handleSearchKey(event)"
            >

            <button onclick="searchCards()">
                Search
            </button>

        </div>

        <div
            id="searchResults"
            class="cardGrid"
        ></div>

    </section>


    <!-- ========================= -->
    <!-- COLLECTION -->
    <!-- ========================= -->

    <section
        id="collectionPage"
        class="hidden"
    >

        <h2>My Collection</h2>

        <div
            id="collection"
            class="cardGrid"
        ></div>

    </section>


    <!-- ========================= -->
    <!-- DECKS -->
    <!-- ========================= -->

    <section
        id="decksPage"
        class="hidden"
    >

        <div class="deckHeader">

            <h2>My Decks</h2>

            <button onclick="createDeck()">
                + Create Deck
            </button>

        </div>

        <div
            id="decks"
            class="deckGrid"
        ></div>

    </section>


    <!-- ========================= -->
    <!-- DECK VIEW -->
    <!-- ========================= -->

    <section
        id="deckViewPage"
        class="hidden"
    >

        <button onclick="showPage('decksPage')">
            ← Back to Decks
        </button>

        <h2 id="deckViewTitle"></h2>

        <div
            id="deckViewCards"
            class="cardGrid"
        ></div>

    </section>
<section id="playPage" class="hidden">

    <h2>Play Magic</h2>

    <!-- GAME MODES -->

    <h3>1. Choose Game Mode</h3>

    <div
        id="gameModes"
        class="gameModeGrid"
    ></div>


    <!-- SELECTED MODE -->

    <div
        id="selectedMode"
        class="selectedMode"
    ></div>


    <!-- DECK -->

    <h3>2. Choose Deck</h3>

    <div
        id="deckSelection"
    ></div>


    <!-- OPPONENT -->

    <h3>3. Choose Opponent</h3>

    <div
        id="opponentSelection"
        class="opponentGrid"
    ></div>


    <!-- START -->

    <div
        id="startGameContainer"
    ></div>

</section>
</main>



<script src="app.js"></script>

<script src="game/gameModes.js"></script>
<script src="game/gameValidator.js"></script>
<script src="game/play.js"></script>

</body>

</html>
