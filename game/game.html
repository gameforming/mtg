<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MTG Game</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

</head>


<body>

<header class="gameHeader">

    <h1>Magic: The Gathering</h1>

    <div>

        Turn:
        <strong id="turnNumber">
            1
        </strong>

        |

        Phase:
        <strong id="currentPhase">
            Beginning
        </strong>

    </div>

</header>


<main id="game">


    <!-- ================================================= -->
    <!-- OPPONENT -->
    <!-- ================================================= -->

    <section class="playerArea opponentArea">

        <div class="playerInfo">

            <h2 id="opponentName">
                AI
            </h2>

            <div>

                ❤️

                <strong id="opponentLife">
                    20
                </strong>

            </div>

        </div>


        <h3>
            Opponent Hand
        </h3>

        <div
            id="opponentHand"
            class="hand hiddenCards"
        ></div>


        <h3>
            Battlefield
        </h3>

        <div
            id="opponentBattlefield"
            class="battlefield"
        ></div>

    </section>


    <!-- ================================================= -->
    <!-- CENTER -->
    <!-- ================================================= -->

    <section class="gameCenter">

        <div class="gameStatus">

            <div>

                Turn

                <strong
                    id="turnNumberCenter"
                >
                    1
                </strong>

            </div>


            <div>

                Phase

                <strong
                    id="currentPhaseCenter"
                >
                    Beginning
                </strong>

            </div>


            <div>

                <strong
                    id="gameMessage"
                >
                    You
                </strong>

                turn

            </div>

        </div>


        <!-- MANA -->

        <div
            id="manaDisplay"
            class="manaDisplay"
        >

            <span>
                ⚪ <strong id="whiteMana">0</strong>
            </span>

            <span>
                🔵 <strong id="blueMana">0</strong>
            </span>

            <span>
                ⚫ <strong id="blackMana">0</strong>
            </span>

            <span>
                🔴 <strong id="redMana">0</strong>
            </span>

            <span>
                🟢 <strong id="greenMana">0</strong>
            </span>

            <span>
                ◇ <strong id="colorlessMana">0</strong>
            </span>

        </div>


        <!-- MULLIGAN -->

        <div
            id="mulliganControls"
            style="display:none;"
        >

            <h2>
                Opening Hand
            </h2>

            <button
                onclick="mulliganOpeningHand(0)"
            >
                Mulligan
            </button>

            <button
                onclick="keepOpeningHand(0)"
            >
                Keep Hand
            </button>

        </div>


        <!-- COMBAT -->

        <div
            id="combatControls"
            style="display:none;"
        >

            <button
                onclick="resolveCombat()"
            >
                Resolve Combat
            </button>

        </div>


        <!-- GAME CONTROLS -->

        <div
            id="gameControls"
        >

            <button
                onclick="nextPhase()"
            >
                Next Phase
            </button>

            <button
                onclick="endTurn()"
            >
                End Turn
            </button>

        </div>

    </section>


    <!-- ================================================= -->
    <!-- PLAYER -->
    <!-- ================================================= -->

    <section class="playerArea playerAreaBottom">

        <div class="playerInfo">

            <h2 id="playerName">
                You
            </h2>

            <div>

                ❤️

                <strong id="playerLife">
                    20
                </strong>

            </div>

        </div>


        <h3>
            Battlefield
        </h3>

        <div
            id="playerBattlefield"
            class="battlefield"
        ></div>


        <h3>
            Your Hand
        </h3>

        <div
            id="playerHand"
            class="hand"
        ></div>

    </section>


    <!-- ================================================= -->
    <!-- LOG -->
    <!-- ================================================= -->

    <section class="gameLog">

        <h2>
            Game Log
        </h2>

        <div id="gameLog"></div>

    </section>

</main>


<script src="gameState.js"></script>
<script src="gameEngine.js"></script>
<script src="ai.js"></script>
<script src="gameUI.js"></script>


</body>

</html>
